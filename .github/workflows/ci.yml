name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elm-lang
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM for JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'

      - name: Ensure Chrome is available (for the headless-browser fidelity tests)
        run: |
          if command -v google-chrome >/dev/null; then bin=$(command -v google-chrome);
          elif command -v chromium-browser >/dev/null; then bin=$(command -v chromium-browser);
          else sudo apt-get update && sudo apt-get install -y chromium-browser && bin=$(command -v chromium-browser); fi
          echo "CHROME_BIN=$bin" >> "$GITHUB_ENV"
          echo "Using Chrome at $bin"; "$bin" --version || true

      - name: Show toolchain
        run: |
          java -version
          node --version

      - name: Build and test
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp clean test

      - name: Coverage report (JaCoCo, best-effort)
        continue-on-error: true
        run: ./mvnw -B -ntp -Pcoverage test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: elm-lang/target/site/jacoco/
          if-no-files-found: ignore

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: elm-lang/target/bench-report.txt
          if-no-files-found: ignore
