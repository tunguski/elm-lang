name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The RTS game and the in-browser editor live in their own repos, checked out under the
      # gitignored projects/. elm-lang builds and tests them from there; without this step those
      # demos' tests skip and the gallery omits their pages.
      - name: Fetch sibling example projects (elm-rts, elm-editor)
        run: |
          git clone --depth 1 --branch master https://github.com/tunguski/elm-rts.git    projects/elm-rts
          git clone --depth 1 --branch master https://github.com/tunguski/elm-editor.git projects/elm-editor

      - name: Set up GraalVM for JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'

      - name: Ensure Chrome is available (for the headless-browser fidelity tests)
        run: |
          if command -v google-chrome >/dev/null; then bin=$(command -v google-chrome);
          elif command -v chromium-browser >/dev/null; then bin=$(command -v chromium-browser);
          else sudo apt-get update && sudo apt-get install -y chromium-browser && bin=$(command -v chromium-browser); fi
          echo "CHROME_BIN=$bin" >> "$GITHUB_ENV"
          echo "Using Chrome at $bin"; "$bin" --version || true

      - name: Show toolchain
        run: |
          java -version
          node --version

      - name: Build and test
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp clean test

      - name: Coverage report (JaCoCo, best-effort)
        continue-on-error: true
        run: ./mvnw -B -ntp -Pcoverage test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: target/site/jacoco/
          if-no-files-found: ignore

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: target/bench-report.txt
          if-no-files-found: ignore
