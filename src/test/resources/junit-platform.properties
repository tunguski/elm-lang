# JUnit Platform configuration for the test suite.
#
# Parallelism is OPT-IN per class: everything runs in a single thread by default, and only classes
# annotated @Execution(CONCURRENT) run their @Test methods concurrently. Those are the
# embarrassingly-parallel compile-and-run backend tests (JsBackendTest, WasmHeapTest, …), where each
# method compiles an independent snippet to a unique temp file and runs it in its own `node`
# subprocess — so concurrency just overlaps the subprocess waits.
#
# This composes with Surefire's JVM forks (pom.xml `test.forkCount`): forks parallelise across test
# *classes*, this parallelises *methods* within the few heavy classes. The fixed pool keeps the
# per-fork thread count bounded so the two layers don't oversubscribe the machine.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=same_thread
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
